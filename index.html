html,body{height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1200px;transform-origin:center center}

/* ---- Hello PC / Cake& light.a reskin ---- */
body{

a:hover{color:var(--color-primary-primary-hover)}

button{color:inherit;cursor:pointer}

}
.cta:hover{background:var(--color-primary-primary-hover)}

.ghost{
  background:transparent;
  border:var(--stroke-200) solid var(--color-stroke-border);
  border-radius:var(--radius-200);
  height:56px;
  padding:0 22px;

}
.ghost:hover{border-color:var(--color-primary-primary)}
.stp{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--color-text-icon-placeholder)}
.stp .n{
  width:32px;height:32px;border-radius:var(--radius-1000);
  border:var(--stroke-200) solid var(--color-stroke-border);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.stp.on{color:var(--color-text-icon-primary)}
.stp.on .n{
  background:var(--color-button-primary-fill);
  border-color:var(--color-button-primary-fill);
  color:var(--color-button-on-primary-fill);
}
.stp.done{color:var(--color-text-icon-secondary)}
.stp.done .n{border-color:var(--color-primary-primary);color:var(--color-primary-primary)}
.nb{
  width:56px;height:56px;border-radius:var(--radius-1000);
  border:var(--stroke-200) solid var(--color-stroke-border);
  background:var(--color-surfaces-on-container);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.nb:hover{border-color:var(--color-primary-primary)}
.nb:disabled{opacity:.3;cursor:not-allowed}
.knob{
  width:112px;height:112px;border-radius:var(--radius-1000);
  background:var(--color-surfaces-on-container);

.ptr{
  position:absolute;left:53px;top:9px;width:6px;height:38px;

.det{display:flex;gap:6px;justify-content:center;height:10px}

.pill{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:var(--radius-1000);font-size:18px;font-weight:700}
.pill.good{background:var(--color-badge-jade-light);color:var(--color-badge-text-icon-on-jade-light)}

  padding:0 48px 36px;box-sizing:border-box;
}

  min-width:72px;height:64px;padding:0 12px;border-radius:var(--radius-200);

}

.kbd-key.wide{min-width:120px;font-size:20px;letter-spacing:.06em;text-transform:uppercase}

/* Chart series — Hello PC DataVis distinct tones */

<div id="stage"></div>

<script>
// =====================================================================
// Kiosk settings (were editable props in the Design artifact).
// Override from the URL, e.g. index.html?idleSeconds=90&resultSeconds=30&hintAfterMoves=3
// =====================================================================
var PROPS = { idleSeconds: 60, resultSeconds: 40, hintAfterMoves: 4 };
(function () {
  var q = new URLSearchParams(location.search);
  [['idleSeconds', 15, 300], ['resultSeconds', 10, 180], ['hintAfterMoves', 1, 20]].forEach(function (d) {
    if (q.has(d[0])) { var n = parseInt(q.get(d[0]), 10); if (!isNaN(n)) PROPS[d[0]] = Math.max(d[1], Math.min(d[2], n)); }
  });
})();

// =====================================================================
// Game data and math (unchanged)
// =====================================================================
// Illustrative economics per workload. vol = units per month; cr = cloud $ per unit; fe = factory power+ops $ per unit;
// fc = factory headroom in units per month (on top of the 30% it already runs); lc/lf = latency (s); minM = smallest model that does the job.
var W = [
  { id: 'air', tag: 'Featured', who: '', task: 'Customer service chat', unit: 'chat', units: 'chats',
    vol: [250e3, 500e3, 1e6, 1.3e6, 2e6], volL: ['250K', '500K', '1M', '1.3M', '2M'],
    cr: [0.03, 0.10, 0.21], fe: [0.02, 0.05, 0.13], fc: [4e6, 6e5, 1.5e5], fixed: 30000,
    lc: [0.6, 1.0, 2.2], lf: [0.3, 0.6, 1.4], minM: 1, tPer: 0.08, tLat: 1.5, tRes: 75,
    factory: 'private AI cluster', factoryShort: 'Cluster', factoryCap: 'Cluster you own',
    facts: [['Demand', '1M chats a month'], ['Data', 'Passenger personal data'], ['Speed', 'Fast — passengers are waiting'], ['Factory', 'Private AI cluster']] },
  { id: 'dev', tag: 'Builders', who: 'Engineering team', task: 'Developer coding agent', unit: 'request', units: 'requests',
    vol: [50e3, 100e3, 250e3, 500e3, 1e6], volL: ['50K', '100K', '250K', '500K', '1M'],
    cr: [0.08, 0.25, 0.60], fe: [0.05, 0.12, 0.30], fc: [1e6, 2e5, 2e4], fixed: 4000,
    lc: [1.0, 1.8, 4.0], lf: [0.6, 1.2, 3.0], minM: 1, tPer: 0.10, tLat: 3, tRes: 75,
    factory: 'ThinkStation PGX', factoryShort: 'PGX', factoryCap: 'PGX at the desk',
    facts: [['Demand', '250K requests a month'], ['Data', 'Proprietary source code'], ['Speed', 'Balanced — keep devs in flow'], ['Factory', 'ThinkStation PGX']] },
  { id: 'sup', tag: 'Enterprise', who: 'Whole workforce', task: 'Enterprise super agent', unit: 'task', units: 'tasks',
    vol: [100e3, 250e3, 500e3, 1e6, 2e6], volL: ['100K', '250K', '500K', '1M', '2M'],
    cr: [0.10, 0.30, 0.90], fe: [0.03, 0.08, 0.25], fc: [1e7, 2e6, 6e5], fixed: 150000,
    lc: [1.5, 2.5, 5.0], lf: [1.0, 1.6, 2.5], minM: 2, tPer: 0.50, tLat: 4, tRes: 75,
    factory: 'AI factory', factoryShort: 'Factory', factoryCap: 'AI factory you own',
    facts: [['Demand', '500K agent tasks a month'], ['Data', 'Internal company data'], ['Speed', 'Volume over speed'], ['Factory', 'Enterprise AI factory']] },
  { id: 'clm', tag: 'Regulated', who: 'Insurance carrier', task: 'Claims review assistant', unit: 'claim', units: 'claims',
    vol: [20e3, 50e3, 100e3, 200e3, 400e3], volL: ['20K', '50K', '100K', '200K', '400K'],
    cr: [0.20, 0.60, 1.20], fe: [0, 0, 0], fc: [2e6, 1.5e5, 3e4], fixed: 37000,
    lc: [2.0, 3.0, 6.0], lf: [1.5, 2.2, 4.5], minM: 1, tPer: 0.37, tLat: 6, tRes: 100,
    factory: 'in-country AI factory', factoryShort: 'Factory', factoryCap: 'In-country factory',
    facts: [['Demand', '100K claims a month'], ['Data', 'Sovereign — stays in-country'], ['Speed', 'Relaxed — accuracy first'], ['Factory', 'In-country AI factory']] }
];
var MOD_L = ['7B', '70B', '700B'];
var CLOUD = [100, 75, 50, 25, 0];
var BG = 0.3; // share of each factory already busy with other work
var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
var START = 'Everything on the biggest model, in the public cloud. 70% of your own GPUs sit idle.';

function money(x) { return x >= 1e6 ? '$' + (x / 1e6).toFixed(2) + 'M' : '$' + Math.round(x / 1000) + 'K'; }
function dollars(x) { return '$' + x.toFixed(2); }
function capitalize(x) { return x.charAt(0).toUpperCase() + x.slice(1); }
function whoTask(w) { return w.who ? (w.who + ' · ' + w.task) : w.task; }
function measureKick(w) { return w.who ? ('Measure · ' + w.who) : ('Measure · ' + w.task); }
function dialLabelHtml(label) {
  if (label === 'Cloud ↔ Factory') {
    return '<div class="dial-label-split"><span>Cloud</span><span class="dial-arrow" aria-hidden="true">↔</span><span>Factory</span></div>';
  }
  return '<div class="dial-label">' + e(label) + '</div>';
}
function donut(pct, color, size) {
  var s = size || 44, r = 14, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct)) / 100;
  var dash = (p * c).toFixed(2) + ' ' + c.toFixed(2);
  return '<svg class="donut" width="' + s + '" height="' + s + '" viewBox="0 0 36 36" aria-hidden="true">' +
    '<circle class="donut-track" cx="18" cy="18" r="' + r + '" fill="none" stroke-width="4"></circle>' +
    '<circle class="donut-fill" cx="18" cy="18" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + dash + '" transform="rotate(-90 18 18)"></circle>' +
  '</svg>';
}
var STAGE_W = 1600, STAGE_H = 1200;
function calc(w, v, m, p, t) {
  var V = w.vol[v], cs = CLOUD[p] / 100, fs = 1 - cs, eff = t ? 0.6 : 1;
  var cloud = V * cs * w.cr[m] * eff, energy = V * fs * w.fe[m] * eff;
  var uw = V * fs / (w.fc[m] / eff);
  var over = uw > 1 ? 1 + 8 * (uw - 1) : 1;
  var lat = cs * w.lc[m] * (t ? 0.8 : 1) + fs * w.lf[m] * (t ? 0.8 : 1) * over;
  var bill = cloud + w.fixed + energy;
  return { V: V, cs: cs, fs: fs, cloud: cloud, energy: energy, uw: uw, u: BG + (1 - BG) * uw, lat: lat, bill: bill, per: bill / V, base: w.fixed + V * w.cr[2] };
}
function checks(w, s) {
  var r = calc(w, s.v, s.m, s.p, s.t);
  return [r.per <= w.tPer + 1e-9, r.lat <= w.tLat, r.fs * 100 >= w.tRes, s.m >= w.minM];
}
function won(w, s) { return checks(w, s).every(function (x) { return x; }); }
function wins(w) {
  var out = [];
  for (var v = 0; v < 5; v++) for (var m = 0; m < 3; m++) for (var p = 0; p < 5; p++) for (var t = 0; t < 2; t++) {
    var s = { v: v, m: m, p: p, t: !!t };
    if (won(w, s)) out.push({ s: s, per: calc(w, v, m, p, !!t).per });
  }
  return out;
}

// =====================================================================
// Game logic (same as the original Component; DCLogic base removed)
// =====================================================================
function Game(props) {
  this.props = props;
  this.state = { screen: 'intro', wi: 0, v: 2, m: 2, p: 0, t: false, key: null, moves: 0, last: Date.now(), initials: 'AAA', kbOpen: false, posted: false, board: [], result: null };
}
Game.prototype.setState = function (patch) { Object.assign(this.state, patch); render(); };
Game.prototype.componentDidMount = function () {
  var self = this;
  this.timer = setInterval(function () {
    var s = self.state;
    if (s.screen === 'intro') return;
    var lim = (s.screen === 'result' ? (self.props.resultSeconds ?? 40) : (self.props.idleSeconds ?? 60)) * 1000;
    if (Date.now() - s.last > lim) self.setState({ screen: 'intro', kbOpen: false });
  }, 1000);
};
Game.prototype.toPick = function () { this.setState({ screen: 'pick', kbOpen: false, last: Date.now() }); };
Game.prototype.begin = function (wi) {
  this.setState({ screen: 'bill', wi: wi, v: 2, m: 2, p: 0, t: false, key: null, moves: 0, last: Date.now(), initials: 'AAA', kbOpen: false, posted: false, result: null });
};
Game.prototype.change = function (patch, key) {
  patch.key = key; patch.moves = this.state.moves + 1; patch.last = Date.now();
  this.setState(patch);
};
Game.prototype.toResult = function () {
  var s = this.state;
  if (s.screen !== 'bill' || !won(W[s.wi], s)) return;
  var r = calc(W[s.wi], s.v, s.m, s.p, s.t);
  var best = Math.min.apply(null, wins(W[s.wi]).map(function (x) { return x.per; }));
  this.setState({ screen: 'result', last: Date.now(), result: { r: r, score: Math.min(1000, Math.round(1000 * best / r.per)) } });
};
Game.prototype.knob = function (i, d) {
  var s = this.state;
  if (s.screen === 'intro') { this.toPick(); return; }
  if (s.screen === 'pick') { this.setState({ wi: (s.wi + d + W.length) % W.length, last: Date.now() }); return; }
  if (s.screen === 'result') return;
  var key = ['v', 'm', 'p'][i], max = [4, 2, 4][i];
  var n = Math.max(0, Math.min(max, s[key] + d));
  if (n === s[key]) return;
  var patch = {}; patch[key] = n;
  this.change(patch, key);
};
Game.prototype.toggle = function () {
  var s = this.state;
  if (s.screen === 'intro') { this.toPick(); return; }
  if (s.screen === 'pick') { this.begin(s.wi); return; }
  if (s.screen === 'result') return;
  this.change({ t: !s.t }, 't');
};
Game.prototype.openKeyboard = function () {
  var s = this.state;
  if (s.screen !== 'result' || s.posted) return;
  this.setState({ kbOpen: true, initials: '', last: Date.now() });
};
Game.prototype.closeKeyboard = function () {
  if (!this.state.kbOpen) return;
  var initials = this.state.initials.length === 3 ? this.state.initials : 'AAA';
  this.setState({ kbOpen: false, initials: initials, last: Date.now() });
};
Game.prototype.typeInitial = function (ch) {
  var s = this.state;
  if (s.screen !== 'result' || s.posted || !s.kbOpen) return;
  ch = String(ch || '').toUpperCase();
  if (!/^[A-Z]$/.test(ch) || s.initials.length >= 3) return;
  this.setState({ initials: s.initials + ch, last: Date.now() });
};
Game.prototype.backspaceInitial = function () {
  var s = this.state;
  if (s.screen !== 'result' || s.posted || !s.kbOpen || !s.initials.length) return;
  this.setState({ initials: s.initials.slice(0, -1), last: Date.now() });
};
Game.prototype.post = function () {

function viewKeyboard(v) {
  if (!v.kbOpen) return '';
  return '<div class="kbd-overlay" data-act="kb-dismiss">' +
    '<div class="kbd" data-act="kb-keep">' +
      '<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">' +
        '<div class="kick" style="font-size: 14px">Type your initials</div>' +
        '<div style="display: flex; gap: 10px">' +
          each(v.letters, function (l) { return '<div class="' + l.cls + '" style="width: 56px; height: 64px; font-size: 36px; pointer-events: none">' + e(l.ch || '·') + '</div>'; }) +
        '</div>' +
      '</div>' +
      each(v.kbRows, function (row) {
        return '<div class="kbd-row">' + each(row, function (ch) {
          return '<button class="kbd-key" type="button" data-act="kb-key" data-ch="' + ch + '">' + ch + '</button>';
        }) + '</div>';
      }) +
      '<div class="kbd-row">' +
        '<button class="kbd-key wide" type="button" data-act="kb-back">Delete</button>' +
        '<button class="kbd-key wide primary" type="button" data-act="kb-done">Done</button>' +

    '</div>' +

}

        '<div style="display: flex; flex-direction: column; gap: 6px">' +

        '</div>' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>' +
        '<div style="display: flex; flex-direction: column; gap: 6px">' +
          '<div class="cap">Your setup</div>' +
          '<div class="mono" style="font-size: 80px; font-weight: 700; line-height: 1">' + e(rs.after) + '</div>' +
        '</div>' +
        '<div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">' +
          '<div class="cap">Score vs. TokenHub\'s best</div>' +
          '<div class="mono" style="font-size: 56px; font-weight: 700; color: var(--color-primary-primary); line-height: 1">' + rs.score + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; flex: 1; align-content: stretch; min-height: 0">' +
        each(rs.outs, function (o) {
          return '<div class="card" style="padding: 22px 24px; display: flex; align-items: center; gap: 18px; min-height: 0">' +
            '<div class="mono" style="font-size: 36px; font-weight: 700; color: var(--color-primary-primary); min-width: 110px">' + e(o.v) + '</div>' +

          '</div>';
        }) +
      '</div>' +
      '<div style="flex: none; font-size: 14px; color: var(--color-text-icon-placeholder)">The right workload, on the right model, on the right infrastructure, at the right cost. · Illustrative scenarios, not validated customer results.</div>' +
    '</div>' +
    '<div style="display: flex; flex-direction: column; gap: 18px; min-width: 0; min-height: 0">' +
      '<div style="flex: 1; background: var(--color-surfaces-primary); border: 2px solid var(--color-primary-primary); border-radius: 24px; padding: 22px 28px; display: flex; flex-direction: column; gap: 12px; min-height: 0">' +

        '<div style="display: flex; flex-direction: column; gap: 6px">' +
          each(v.execQs, function (q) {
            return '<div style="display: flex; gap: 12px; font-size: 18px; line-height: 1.3"><span class="mono" style="color: var(--color-primary-primary); font-weight: 700">' + q.n + '</span><span>' + e(q.t) + '</span></div>';

        '<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px">' +
          '<span class="chip">Spend by app and user</span><span class="chip">Request-level tracing</span><span class="chip">Model routing</span><span class="chip">Budgets and alerts</span>' +
        '</div>' +
      '</div>' +
      '<div class="card" style="flex: none; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">' +
        '<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">' +
          '<div class="kick" style="font-size: 15px">Leaderboard</div>' +
          '<div class="cap" style="font-size: 14px; text-align: right">' + e(v.lbHint) + '</div>' +
        '</div>' +
        '<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">' +
          each(v.letters, function (l) {

          }) +
          (v.canPost ?
            '<button class="cta" style="height: 76px; margin-left: auto; padding: 0 22px; font-size: 22px" data-act="post"' + (v.canSubmit ? '' : ' disabled') + '>Post</button>' :
            '<button class="cta" style="height: 76px; margin-left: auto; padding: 0 18px; font-size: 20px" data-act="again">Play again ' + ARROW + '</button>') +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 4px">' +
          each(v.board, function (b) {
            return '<div style="display: grid; grid-template-columns: 28px 64px minmax(0, 1fr) 58px; gap: 8px; align-items: center; font-size: 17px; padding: 4px 0; border-bottom: 1px solid var(--color-surfaces-on-container-low); color: ' + b.col + '">' +
              '<span class="mono">' + b.rank + '</span><span class="mono" style="font-weight: 700">' + e(b.ini) + '</span>' +
              '<span style="font-size: 14px; color: var(--color-text-icon-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">' + e(b.task) + '</span>' +
              '<span class="mono" style="font-weight: 700; text-align: right">' + b.score + '</span>' +
            '</div>';
          }) +

function viewControls(v) {
  return '<div class="controls-row" style="flex: none; margin: 0 48px 28px">' +
    '<div style="flex: 1; display: flex; align-items: flex-start; gap: 12px; background: var(--color-surfaces-container); border: 1px solid var(--color-stroke-border-container); border-radius: 26px; padding: 14px 28px; min-width: 0; box-sizing: border-box">' +
      each(v.knobs, function (k) {
        return '<div class="dial">' +
          dialLabelHtml(k.label) +
          '<div class="dial-row">' +
            '<button class="nb" data-act="dec" data-i="' + k.i + '"' + (k.atMin ? ' disabled' : '') + ' aria-label="Turn ' + e(k.label) + ' left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>' +
            '<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">' +
              '<div class="knob" aria-hidden="true"><div class="ptr" style="transform: rotate(' + k.deg + 'deg)"></div></div>' +
              '<div class="det" aria-hidden="true">' + each(k.dots, function (d) { return '<span class="' + d.cls + '"></span>'; }) + '</div>' +
            '</div>' +
            '<button class="nb" data-act="inc" data-i="' + k.i + '"' + (k.atMax ? ' disabled' : '') + ' aria-label="Turn ' + e(k.label) + ' right"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>' +
          '</div>' +
          '<div class="disp dial-val">' + e(k.val) + '</div>' +
        '</div>';
      }) +
    '</div>' +
    '<div class="tgl-panel">' +
      '<div class="tgl-meta">' +
        '<div class="dial-label" style="letter-spacing: 0.12em">' + e(v.tglLabel) + '</div>' +
        (v.tglComingSoon ? '<span class="pill soon">Coming soon!</span>' : '') +
      '</div>' +
      '<button class="' + v.tglCls + '" data-act="flip" aria-pressed="' + v.tglOn + '" aria-label="' + e(v.tglLabel) + '"><span class="lev"></span></button>' +
      '<div class="disp dial-val" style="font-size: 22px">' + e(v.tglTxt) + '</div>' +
    '</div>' +
  '</div>';
}

function view(v) {
  return '<div style="width: ' + STAGE_W + 'px; height: ' + STAGE_H + 'px; box-sizing: border-box; background: var(--color-surfaces-canvas); color: var(--color-text-icon-primary); font-family: "Rookery New", "Rookery", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">' +
    '<div style="flex: none; height: 76px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--color-surfaces-on-container-low)">' +
      '<div style="display: flex; align-items: center; gap: 14px">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-primary)" stroke-width="2" stroke-linejoin="round" aria-hidden="true">' + HEX('var(--color-primary-primary)') + '</svg>' +
        '<span class="disp" style="font-size: 26px; font-weight: 700">Token Ops Challenge</span>' +
        '<span class="brand-sep" aria-hidden="true"></span>' +
        '<a class="nvidia-brand" href="https://www.nvidia.com/" target="_blank" rel="noopener noreferrer" aria-label="NVIDIA">' +
          '<img src="assets/nvidia-mark.png" alt="" width="43" height="28">' +
          '<span class="nvidia-word">NVIDIA</span>' +
        '</a>' +
      '</div>' +
      '<div style="display: flex; align-items: center; gap: 36px">' +
        each(v.steps, function (p) { return '<div class="' + p.cls + '"><span class="n mono">' + p.n + '</span><span>' + e(p.label) + '</span></div>'; }) +
      '</div>' +
    '</div>' +
    (v.isIntro ? viewIntro() : '') +
    (v.isPick ? viewPick(v) : '') +
    (v.isBill ? viewBill(v) : '') +
    (v.isResult ? viewResult(v) : '') +
    (v.isBill ? viewControls(v) : '') +
  '</div>';
}

// =====================================================================
// Tiny DOM patcher: keeps existing elements so CSS transitions
// (knob pointer, bars, toggle lever) animate exactly as before.
// =====================================================================
function syncAttrs(f, t) {
  for (var i = f.attributes.length - 1; i >= 0; i--) { var n = f.attributes[i].name; if (!t.hasAttribute(n)) f.removeAttribute(n); }
  for (var j = 0; j < t.attributes.length; j++) { var a = t.attributes[j]; if (f.getAttribute(a.name) !== a.value) f.setAttribute(a.name, a.value); }
}
function patch(from, to) {
  var b = Array.prototype.slice.call(to.childNodes);
  for (var i = 0; i < b.length; i++) {
    var f = from.childNodes[i], t = b[i];
    if (!f) { from.appendChild(t); continue; }
    if (f.nodeType !== t.nodeType || f.nodeName !== t.nodeName) { from.replaceChild(t, f); continue; }
    if (f.nodeType !== 1) { if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue; continue; }
    syncAttrs(f, t); patch(f, t);
  }
  while (from.childNodes.length > b.length) from.removeChild(from.lastChild);
}

var stage = document.getElementById('stage');
var game = new Game(PROPS);
function render() {
  var tpl = document.createElement('template');
  tpl.innerHTML = view(game.renderVals());
  patch(stage, tpl.content);
}

// Event delegation (replaces the original onClick bindings)
stage.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var act = el.getAttribute('data-act');
  if (act === 'kb-keep') { ev.stopPropagation(); return; }
  var i = +el.getAttribute('data-i');
  switch (act) {
    case 'start': game.toPick(); break;
    case 'pick': game.setState({ wi: i, last: Date.now() }); break;
    case 'confirm': game.begin(game.state.wi); break;
    case 'success': game.toResult(); break;
    case 'post': game.post(); break;
    case 'again': game.toPick(); break;
    case 'kb-open': game.openKeyboard(); break;
    case 'kb-done':
    case 'kb-dismiss': game.closeKeyboard(); break;
    case 'kb-key': game.typeInitial(el.getAttribute('data-ch')); break;
    case 'kb-back': game.backspaceInitial(); break;
    case 'dec': game.knob(i, -1); break;
    case 'inc': game.knob(i, 1); break;
    case 'flip': game.toggle(); break;
  }
});

document.addEventListener('keydown', function (ev) {
  if (!game.state.kbOpen || game.state.screen !== 'result') return;
  if (ev.key === 'Escape') { game.closeKeyboard(); ev.preventDefault(); return; }
  if (ev.key === 'Backspace') { game.backspaceInitial(); ev.preventDefault(); return; }
  if (ev.key === 'Enter') { game.closeKeyboard(); ev.preventDefault(); return; }
  if (/^[a-zA-Z]$/.test(ev.key)) { game.typeInitial(ev.key); ev.preventDefault(); }
});

// Scale the fixed 1600x1200 (4:3) console to fit the window
function fit() {
  var s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
render();
game.componentDidMount();
</script>
